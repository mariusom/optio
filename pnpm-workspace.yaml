packages:
  - "."

# Keep one Effect version across the app, Effect UI and its devtools.
overrides:
  effect: 4.1.5
  "@effect/vitest": 4.1.5
  "@effect/platform-browser": 4.1.5
  "@effect/platform-node": 4.1.5
  "@effect/platform-node-shared": 4.1.5
  vite@*: npm:@voidzero-dev/vite-plus-core@8.3.8000
  vitest@*: "catalog:"
  # Effect UI is a public preview with no npm release: pin its packages to one
  # pkg.pr.new snapshot of Effect-TS/ui so their cross-references resolve.
  "@effect/ui": https://pkg.pr.new/Effect-TS/ui/@effect/ui@7bff56b
  "@effect/ui-kit": https://pkg.pr.new/Effect-TS/ui/@effect/ui-kit@7bff56b

allowBuilds:
  msgpackr-extract: false

# Supply-chain guard: refuse dependency versions published less than 24h ago.
minimumReleaseAge: 1440

onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - esbuild
catalog:
  vitest: 5.1.0
  vite-plus: 1.7.0
  "@vitest/browser-playwright": 5.1.0
# Vite peers see the core alias package version, rather than its bundled Vite 8.
peerDependencyRules:
  allowedVersions:
    vite: "8.3.8000"
