packages:
  - "."

# Keep one Effect version across app, worker and LiveStore RPC runtimes.
# FoldKit 0.170 supports Effect 4.1; align LiveStore's runtime packages with it.
overrides:
  effect: 4.1.2
  "@effect/vitest": 4.1.2
  "@effect/opentelemetry": 4.1.2
  "@effect/platform-browser": 4.1.2
  "@effect/platform-bun": 4.1.2
  "@effect/platform-node": 4.1.2
  "@effect/platform-node-shared": 4.1.2
  # LiveStore still pins vulnerable Nano ID 5.0.9.
  "@livestore/utils>nanoid": 5.1.16
  # OpenTelemetry SDK 2.12 requires the API below 1.10.
  "@opentelemetry/api": 1.9.1
  vite@*: npm:@voidzero-dev/vite-plus-core@1.4.0
  vitest@*: "catalog:"

allowBuilds:
  msgpackr-extract: false

# Supply-chain guard: refuse dependency versions published less than 24h ago.
minimumReleaseAge: 1440

onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - esbuild
  - rolldown
  - sqlite-wasm
catalog:
  vitest: 5.0.5
  vite-plus: 1.4.0
  "@vitest/browser-playwright": 5.0.5
# Vite peers see the core alias package version, rather than its bundled Vite 8.
peerDependencyRules:
  allowedVersions:
    vite: "1.4.0"
