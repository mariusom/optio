packages:
  - "."

# Worker RPC protocols must match FoldKit's Effect release exactly.
overrides:
  effect: 4.0.0
  "@effect/opentelemetry": 4.0.0
  "@effect/platform-browser": 4.0.0
  "@effect/platform-bun": 4.0.0
  "@effect/platform-node": 4.0.0
  "@effect/platform-node-shared": 4.0.0
  # LiveStore pins 5.0.9; 5.1.16 fixes its three known nanoid advisories.
  "@livestore/utils>nanoid": 5.1.16

allowBuilds:
  msgpackr-extract: false

# Supply-chain guard: refuse dependency versions published less than 24h ago.
minimumReleaseAge: 1440

onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - esbuild
  - rolldown
  - sqlite-wasm
