packages:
  - '.'

allowBuilds:
  msgpackr-extract: set this to true or false

# Supply-chain guard: refuse dependency versions published less than 24h ago.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - foldkit

onlyBuiltDependencies:
  - '@tailwindcss/oxide'
  - esbuild
  - rolldown
  - sqlite-wasm

# msgpackr-extract ships an optional native accelerator; its postinstall is
# intentionally skipped — the pure-JS fallback is used instead.
ignoredBuiltDependencies:
  - msgpackr-extract
