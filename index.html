<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <!-- home-screen icon (must be a PNG; SVG is ignored by some mobile platforms) -->
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <!-- viewport-fit=cover is required for env(safe-area-inset-*) on notched displays -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="See where your time goes. Create time studies, record tasks, and export CSV with Optio. Works offline after setup. No account needed."
    />
    <link rel="canonical" href="https://mariusom.github.io/optio/" />
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
    <link rel="alternate" type="text/plain" href="/llms.txt" title="About Optio for agents" />
    <link rel="ai-catalog" type="application/json" href="/ai-catalog.json" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Optio" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:url" content="https://mariusom.github.io/optio/" />
    <meta property="og:title" content="Optio — see where your time goes" />
    <meta
      property="og:description"
      content="Create time studies, record tasks, and export CSV. Offline-ready, open source, and no account needed."
    />
    <meta property="og:image" content="https://mariusom.github.io/optio/social-card.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Optio. See where your time goes. Offline time & motion studies. Offline-ready · No account · Open source."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Optio — see where your time goes" />
    <meta
      name="twitter:description"
      content="Create time studies, record tasks, and export CSV. Offline-ready, open source, and no account needed."
    />
    <meta name="twitter:image" content="https://mariusom.github.io/optio/social-card.png" />
    <meta
      name="twitter:image:alt"
      content="Optio. See where your time goes. Offline time & motion studies. Offline-ready · No account · Open source."
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Optio",
        "url": "https://mariusom.github.io/optio/",
        "description": "Create time studies, record tasks, review sessions, and export CSV. Works offline after initial loading, with no account required.",
        "applicationCategory": "ProductivityApplication",
        "operatingSystem": "Web browser",
        "browserRequirements": "Requires JavaScript and browser storage support.",
        "image": "https://mariusom.github.io/optio/social-card.png",
        "isAccessibleForFree": true,
        "license": "https://github.com/mariusom/optio/blob/main/LICENSE",
        "featureList": [
          "Custom study questions",
          "Task observations",
          "Session history",
          "CSV export",
          "Offline use after initial loading"
        ]
      }
    </script>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="optio" />
    <meta name="theme-color" content="#f5f8f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c1311" media="(prefers-color-scheme: dark)" />
    <title>Optio — offline time &amp; motion studies</title>
  </head>
  <body>
    <div id="root">
      <noscript>
        <style>
          .static-fallback {
            box-sizing: border-box;
            min-height: 100vh;
            margin: 0;
            padding: clamp(2rem, 8vw, 5rem) 1.5rem;
            color: #17201d;
            background: #f5f8f5;
            font:
              16px/1.6 ui-sans-serif,
              system-ui,
              -apple-system,
              BlinkMacSystemFont,
              "Segoe UI",
              sans-serif;
          }
          .static-fallback__content {
            max-width: 42rem;
            margin: 0 auto;
          }
          .static-fallback h1 {
            margin: 0 0 1rem;
            font-size: clamp(2.5rem, 10vw, 4.5rem);
            line-height: 1;
            letter-spacing: -0.04em;
          }
          .static-fallback h2 {
            margin: 2.5rem 0 0.5rem;
            font-size: 1.25rem;
          }
          .static-fallback p {
            max-width: 38rem;
            margin: 0.75rem 0;
          }
          .static-fallback a {
            color: inherit;
            font-weight: 650;
          }
          .static-fallback__action {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.7rem 1rem;
            border: 1px solid currentColor;
            border-radius: 0.75rem;
          }
          @media (prefers-color-scheme: dark) {
            .static-fallback {
              color: #e7eeea;
              background: #0c1311;
            }
          }
        </style>
        <main class="static-fallback" data-static-fallback>
          <div class="static-fallback__content">
            <h1>Optio</h1>
            <p>
              See where your time goes. Optio helps you create time studies, record tasks as you
              work, review completed sessions, and export results as CSV.
            </p>
            <h2>Private by default, with no account</h2>
            <p>
              Studies stay in this browser and Optio has no backend or automatic sync. Browser
              storage can be cleared or lost, so export important results as a backup. After the
              first successful load, the app can work offline.
            </p>
            <h2>Open source</h2>
            <p>
              Optio is free, open-source software. You can inspect the code and license on
              <a href="https://github.com/mariusom/optio">GitHub</a>.
            </p>
            <p>This interactive app requires JavaScript and browser storage support.</p>
            <a class="static-fallback__action" href="./">Try loading Optio again</a>
          </div>
        </main>
      </noscript>
    </div>
    <script type="module" src="/src/entry.ts"></script>
  </body>
</html>
