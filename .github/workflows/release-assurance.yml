name: Release assurance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    name: Validate and package main
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Confirm main branch
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: ./.github/actions/setup
        with:
          playwright: true
      - uses: ./.github/actions/validate
      - name: Create release-assurance archive and checksum
        run: |
          archive="optio-dist-${GITHUB_SHA}.tar.gz"
          tar -czf "$archive" dist
          sha256sum "$archive" > SHA256SUMS
      - name: Upload release-assurance artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: optio-dist-${{ github.sha }}
          path: |
            optio-dist-${{ github.sha }}.tar.gz
            SHA256SUMS
          if-no-files-found: error

  attest:
    name: Attest archive checksum
    needs: validate-and-package
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download validated artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: optio-dist-${{ github.sha }}
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: SHA256SUMS
